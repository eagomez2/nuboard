<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>audio</title>
  </head>
  <body>
    <div id="player" class="player" tabindex="0">
      <div id="fs-header" class="fs-header" hidden>
        <span id="fs-title" class="fs-title"></span>
        <button id="fs-close" class="btn icon" title="Close full screen (Esc)">
          <svg viewBox="0 0 24 24">
            <path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z" />
          </svg>
        </button>
      </div>
      <div class="toolbar">
        <button id="play" class="btn icon primary" title="Play / pause (Space in full screen)">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13l10.5-6.5z" /></svg>
          <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
        </button>
        <span class="time"
          ><span id="current">0:00.000</span><span class="sep">/</span><span id="duration">0:00.000</span></span
        >
        <div id="context" class="context">
          <span class="context-hint"
            >Drag to select<span class="hint-band"> · B or Alt-drag on the spectrogram for a band</span></span
          >
          <span id="selection" class="chip" role="group" aria-label="Selection" hidden>
            <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 5h2v14H3zm16 0h2v14h-2zM7 11h10v2H7z" />
            </svg>
            <span id="selection-text" class="chip-value"></span>
            <span id="selection-span" class="chip-extra"></span>
            <span class="divider"></span>
            <button id="loop" class="seg toggle" title="Loop the selection (L)" aria-label="Loop">
              <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z" /></svg>
              <span class="lbl">Loop</span>
            </button>
            <button
              id="zoom-selection"
              class="seg"
              title="Zoom to the selection (Z)"
              aria-label="Zoom in to the selection"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm.5-7H9v2H7v1h2v2h1v-2h2V9h-2z"
                />
              </svg>
              <span class="lbl">Zoom</span>
            </button>
            <button
              id="annotate"
              class="seg"
              title="Add a note on the selection, or edit the note it matches (N)"
              aria-label="Note"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H5.17L4 17.17V4h16zM7 7h10v2H7zm0 4h7v2H7z"
                />
              </svg>
              <span class="lbl">Note</span>
            </button>
            <button
              id="clear-selection"
              class="close"
              title="Clear the selection (Esc)"
              aria-label="Clear the selection"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M7.05 5.64 5.64 7.05 10.59 12l-4.95 4.95 1.41 1.41L12 13.41l4.95 4.95 1.41-1.41L13.41 12l4.95-4.95-1.41-1.41L12 10.59z"
                />
              </svg>
            </button>
          </span>
          <span id="band" class="chip band" role="group" aria-label="Frequency band" hidden>
            <button
              id="band-toggle"
              class="seg toggle on"
              title="Play only this band, or every frequency again (the band is kept)"
              aria-label="Play only the band"
              aria-pressed="true"
            >
              <svg viewBox="0 0 24 24">
                <path d="M7 18h2V6H7zm4 4h2V2h-2zm-8-8h2v-4H3zm12 4h2V6h-2zm4-8v4h2v-4z" />
              </svg>
              <span class="lbl">Band</span>
            </button>
            <input
              id="band-lo"
              class="band-hz"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Band bottom, Hz"
              title="Bottom of the band: type 300, 2.5k or 2,5 kHz and Enter"
            />
            <span class="band-dash">–</span>
            <input
              id="band-hi"
              class="band-hz"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Band top, Hz"
              title="Top of the band: type 3400, 2.5k or 2,5 kHz and Enter"
            />
            <span class="band-unit">Hz</span>
            <button
              id="band-clear"
              class="close"
              title="Clear the band and play every frequency (Esc)"
              aria-label="Clear the band"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M7.05 5.64 5.64 7.05 10.59 12l-4.95 4.95 1.41 1.41L12 13.41l4.95 4.95 1.41-1.41L13.41 12l4.95-4.95-1.41-1.41L12 10.59z"
                />
              </svg>
            </button>
          </span>
          <form id="note-form" class="note-form" hidden>
            <span id="note-time" class="note-time"></span>
            <input
              id="note-text"
              type="text"
              placeholder="Note for this selection (Enter to add, Esc to cancel)"
              autocomplete="off"
            />
            <button id="note-submit" type="submit" class="btn small toggle on">Add</button>
            <button id="note-delete" type="button" class="btn small" hidden>Delete</button>
            <button id="note-cancel" type="button" class="btn small">Cancel</button>
          </form>
        </div>
        <span class="group" role="group" aria-label="View">
          <button
            id="band-mode"
            class="seg icon toggle spec-only"
            title="Pick a frequency band: drag on the spectrogram (B, or Alt-drag)"
            aria-label="Pick a band"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24">
              <path d="M3 3h5v2H5v3H3zm13 0h5v5h-2V5h-3zM3 16h2v3h3v2H3zm16 3h-3v2h5v-5h-2zM7 9h10v2H7zm0 4h10v2H7z" />
            </svg>
          </button>
          <span class="divider spec-only"></span>
          <select id="rate" class="seg" title="Playback speed" aria-label="Playback speed">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
          <span class="divider"></span>
          <button id="zoom-out" class="seg icon" title="Zoom out (−)" aria-label="Zoom out">
            <svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z" /></svg>
          </button>
          <input id="zoom" class="zoom-range" type="range" min="0" max="1000" value="0" title="Zoom (Ctrl + wheel)" />
          <button id="zoom-in" class="seg icon" title="Zoom in (+)" aria-label="Zoom in">
            <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" /></svg>
          </button>
          <button id="fit" class="seg icon" title="Show the whole file (0)" aria-label="Fit">
            <svg viewBox="0 0 24 24">
              <path d="M3 5h2v14H3zm16 0h2v14h-2zM6.5 12l3.5 3.5V13h4v2.5l3.5-3.5L14 8.5V11h-4V8.5z" />
            </svg>
          </button>
          <span class="divider"></span>
          <button id="fullscreen" class="seg icon" title="Full screen (F)" aria-label="Full screen">
            <svg viewBox="0 0 24 24" class="i-expand">
              <path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z" />
            </svg>
            <svg viewBox="0 0 24 24" class="i-collapse">
              <path d="M8 5h2v5H5V8h3zm6 0h2v3h3v2h-5zM5 14h5v5H8v-3H5zm9 0h5v2h-3v3h-2z" />
            </svg>
          </button>
        </span>
      </div>
      <div id="minimap" class="minimap"></div>
      <div id="message" class="message" hidden></div>
      <canvas id="ruler" class="ruler"></canvas>
      <div id="notes-lane" class="notes-lane" hidden></div>
      <div id="waveform" class="waveform"></div>
    </div>
    <script type="module" src="/src/audio/main.ts"></script>
  </body>
</html>
