[project]
name = "nuboard"
version = "0.4.2"
description = "A fast, local, folder-based experiment tracker and viewer for ML training."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Esteban Gómez" }]
keywords = ["machine-learning", "experiment-tracking", "tensorboard", "visualization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The logging side is standard library only.
dependencies = []

[project.optional-dependencies]
viewer = ["numpy>=1.23", "pyarrow>=14", "starlette>=0.37", "uvicorn>=0.29"]

[project.scripts]
nuboard = "nuboard.cli:main"

[dependency-groups]
dev = [
    "numpy>=1.23", "pyarrow>=14", "starlette>=0.37", "uvicorn>=0.29",
    "httpx", "pytest", "ruff", "pyright", "pillow", "matplotlib",
    "mkdocs>=1.6,<2", "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuboard"]
artifacts = ["src/nuboard/static/**"]

[tool.hatch.build.targets.sdist]
exclude = ["frontend/node_modules", "frontend/test-results", "site"]
artifacts = ["src/nuboard/static/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B905", "A002"]  # zip(strict=) noise; `dir=` mirrors the public API

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
